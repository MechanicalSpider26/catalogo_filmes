{% extends 'base.html' %}

{% block titulo %}Cadastrar Novo Diretor{% endblock %}

{% block conteudo %}
<div class="form-card">
    <h2 class="form-title">Cadastrar Novo Diretor</h2>

    <form action="{{ url_for('cadastro_diretor') }}" method="POST">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required>
            </div>

            <div class="form-group">
                <label for="nacionalidade">Nacionalidade:</label>
                <input type="text" id="nacionalidade" name="nacionalidade" value="{{ nacionalidade or '' }}">
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" value="{{ data_nascimento or '' }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Diretor</button>
            <a href="/diretores" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
