{% extends 'base.html' %}

{% block titulo %}Cadastrar Diretor{% endblock %}

{% block conteudo %}
<h2>Cadastrar Novo Diretor</h2>

{% if erro %}
    <p style="color: red;"><strong>Erro:</strong> {{ erro }}</p>
{% endif %}

<form method="POST">
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome" value="{{ nome or '' }}"><br><br>

    <label for="nacionalidade">Nacionalidade:</label><br>
    <input type="text" id="nacionalidade" name="nacionalidade" value="{{ nacionalidade or '' }}"><br><br>

    <label for="data_nascimento">Data de Nascimento:</label><br>
    <input type="text" id="data_nascimento" name="data_nascimento" placeholder="DD/MM/AAAA" value="{{ data_nascimento or '' }}"><br><br>

    <button type="submit">Salvar Diretor</button>
</form>
{% endblock %}
